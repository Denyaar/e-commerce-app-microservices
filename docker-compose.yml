  opensearch:
    build: .
    container_name: marketplace_os
    hostname: marketplace_os
    ports:
      - 9200:9200
      - 9600:9600
    environment:
      - discovery.type=single-node
      - "DISABLE_SECURITY_PLUGIN=true"
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: marketplace_os_dashboards
    ports:
      - 5601:5601
    environment:
      OPENSEARCH_HOSTS: '["http://marketplace-os:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      - opensearch


  postgres:
    container_name: ms_pd_sql
    image: postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: Mupezeni0102?
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - microservices-net
    restart: unless-stopped

  pgadmin:
    container_name: ms_pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - 5050:80
    networks:
      - microservices-net
    restart: unless-stopped

  mongo:
    container_name: ms_mongo_db
    image: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 'Mupezeni0102'
    ports:
      - "27017:27017"
    volumes:
      - mongo:/data/db
    networks:
        - microservices-net

  opengauss:
    image: opengauss/opengauss:latest
    container_name: opengauss
    privileged: true
    environment:
      - GS_PASSWORD=openGauss@123
      - GS_USERNAME=root
      - GS_USER_PASSWORD=Mupezeni0102?
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - opengauss_data:/var/lib/opengauss/data

  cassandra:
    image: cassandra:latest
    container_name: cassandra-container
    restart: unless-stopped
    networks:
      - microservices-net
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_USER=root
      - CASSANDRA_PASSWORD=Mupezeni0102
    volumes:
      - cassandra-data:/var/lib/cassandra

  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_PASS: Mupezeni0102?
      RABBITMQ_DEFAULT_USER: root
    image: "rabbitmq:3-management-alpine"
    container_name: ms_rabbitmq
    ports:
      - "15672:15672"
      - "5672:5672"

  redis:
    image: "redis:latest"
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - microservices-net

  redis-insight:
    image: redis/redisinsight:latest
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - redis-insight:/data
    networks:
      - microservices-net

  minio:
    image: quay.io/minio/minio
    container_name: "epg-minio"
    restart: unless-stopped
    ports:
      - "9050:9000"
      - "9090:9090"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: Mupezeni0102?
    command: server /data --console-address ":9090"


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx1g
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - esdata1:/usr/share/elasticsearch/data


