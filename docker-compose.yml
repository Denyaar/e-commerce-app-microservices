#    image: wurstmeister/zookeeper
#    container_name: ms_zookeeper
#    ports:
#      - "22181:2181"

  zookeeper:
    image: wurstmeister/zookeeper
    container_name: ms_zookeeper
    ports:
      - "22181:2181"
    environment:
      - ZOO_MAX_JVM_HEAP=2g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 2g
    mem_reservation: 1g
    networks:
      - microservices-net


  kafka:
    image: wurstmeister/kafka
    container_name: ms_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: localhost
      KAFKA_ZOOKEEPER_CONNECT: ms_zookeeper:2181
    depends_on:
      - zookeeper
    networks:
      - microservices-net

  zipkin:
    image: openzipkin/zipkin
    container_name: ms_zipkin
    ports:
      - "9411:9411"
    networks:
        - microservices-net
