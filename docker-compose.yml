  keycloak:
    container_name: ms_keycloak
    image: quay.io/keycloak/keycloak:latest
    ports:
      - 8080:8080
    environment:
        KEYCLOAK_ADMIN: mupezeni
        KEYCLOAK_ADMIN_PASSWORD: 'Mupezeni0102?'
    networks:
        - microservices-net
    command:
      - "start-dev"
    restart: unless-stopped





networks:
  microservices-net:
    driver: bridge

volumes:
  postgres:
  opengauss_data:
  pgadmin:
  mongo: {}
  redis-insight: {}
  rabbitmq: {}
  zookeeper: {}
  kafka: {}
  minio-data: {}
  zipkin: {}
  cassandra-data: {}
  esdata1:
    driver: local


