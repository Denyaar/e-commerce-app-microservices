  mail-dev:
    container_name: ms_mail_dev
    image: maildev/maildev
    ports:
      - 1080:1080
      - 1025:1025
#    environment:
#      MAILDEV_USERNAME: root
#      MAILDEV_PASSWORD: Mupezeni0102?

#  zookeeper:
#    image: wurstmeister/zookeeper
#    container_name: ms_zookeeper
#    ports:
#      - "22181:2181"

  zookeeper:
    image: wurstmeister/zookeeper
    container_name: ms_zookeeper
    ports:
      - "22181:2181"
    environment:
      - ZOO_MAX_JVM_HEAP=2g    # Set JVM heap size if not already done
    ulimits:
      nofile:
        soft: 65536  # Increase the soft limit for file descriptors
        hard: 65536  # Increase the hard limit for file descriptors
    mem_limit: 2g
    mem_reservation: 1g


  kafka:
    image: wurstmeister/kafka
    container_name: ms_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: localhost
      KAFKA_ZOOKEEPER_CONNECT: ms_zookeeper:2181
    networks:
      - microservices-net

  zipkin:
    image: openzipkin/zipkin
    container_name: ms_zipkin
    ports:
      - "9411:9411"
    networks:
        - microservices-net
