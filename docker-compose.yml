#


  keycloak:
    container_name: ms_keycloak
    build:
      context: .
      dockerfile: keycloak/Dockerfile
    depends_on:
      - postgres
    ports:
      - 8082:8080
    environment:
      # Keycloak Admin
      KC_BOOTSTRAP_ADMIN_USERNAME: mupezeni
      KC_BOOTSTRAP_ADMIN_PASSWORD: 'Mupezeni0102?'

      # Keycloak Configuration
      KC_FEATURES: scripts
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HOSTNAME: "localhost"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

      # Database Configuration (PostgreSQL)
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://ms_pd_sql:5432/keycloak
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: 'Mupezeni0102?'
      KC_DB_SCHEMA: public

      # Twilio Configuration (SMS OTP)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}

      # SMTP Configuration (Email OTP)
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@ecocash.co.zw}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-EcoCash}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}

    networks:
      - microservices-net

      # Correct way to pass start-dev and enable your upload scripts:
    command: start-dev --spi-script-upload-enabled=true
#    command:
#      - "start-dev"
#      - "--spi-script-upload-enabled=true"
    restart: unless-stopped


  ecopay-app:
    image: zzzzzzzzzz
    container_name: ECOPAY-APP
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis  # Use service name, not container name
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - microservices-net

  kong-bootstrap:
    image: '${GW_IMAGE:-kong/kong-gateway:3.13.0.1}'  # Kong Gateway image (default to latest version)
    container_name: kong-bootstrap
    networks:
      - microservices-net
    depends_on:
      - postgres
    restart: on-failure
    environment:
      <<: *kong-env                 # Reuse environment config from x-kong-config
      KONG_PASSWORD: handyshake    # Admin GUI password (required for RBAC)
    command: kong migrations bootstrap  # Run DB migrations to initialize Kong schema

  kong-cp:
    image: '${GW_IMAGE:-kong/kong-gateway:3.13.0.1}'  # Main Kong Gateway Control Plane (default to latest version)
    container_name: kong-cp
    restart: on-failure
    networks:
      - microservices-net
    environment:
      <<: *kong-env
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl  # Admin API on HTTP + HTTPS
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002, 0.0.0.0:8445 ssl  # Kong Manager on HTTP + HTTPS
      KONG_ADMIN_GUI_URL: http://${GW_HOST:-localhost}:8002  # URL for GUI links
      KONG_PASSWORD: handyshake  # Required for logging in to Kong Manager (RBAC)
    depends_on:
      kong-bootstrap:
        condition: service_completed_successfully  # Start only after bootstrap has succeeded
    ports:
      - "8000:8000"  # Proxy HTTP
      - "8543:8443"  # Proxy HTTPS
      - "8011:8001"  # Admin API HTTP
      - "8544:8444"  # Admin API HTTPS
      - "8002:8002"  # Kong Manager HTTP
      - "8545:8445"  # Kong Manager HTTPS


networks:
  microservices-net:
    driver: bridge

volumes:
  postgres_data: {}
  mysql_data: {}
  opengauss_data:
  pgadmin:
  meilisearch: {}
  mongo: {}
  sqlite: {}
  redis-insight: {}
  rabbitmq: {}
  zookeeper: {}
  kafka: {}
  minio-data: {}
  zipkin: {}
  cassandra-data: {}
  esdata1:
    driver: local
