# Common environment variables used by Kong services (bootstrap and CP)
x-kong-config: &kong-env
  KONG_DATABASE: postgres             # Use Postgres as the backing database
  KONG_PG_HOST: ms_pd_sql             # Hostname of the Postgres service
  KONG_PG_DATABASE: kong              # Name of the database to connect to
  KONG_PG_USER: root                  # Database username
  KONG_PG_PASSWORD: Mupezeni0102?     # Database password
  KONG_LICENSE_DATA: "${KONG_LICENSE_DATA}"  # Kong Enterprise license passed via environment variable

services:
#
#  meilisearch:
#    image: "getmeili/meilisearch:latest"
#    restart: unless-stopped
#    ports:
#      - "127.0.0.1:7700:7700"
#    volumes:
#      - /var/local/meilisearch:/data.ms
#    env_file:
#      - ./meilisearch.env


  meilisearch:
    image: 'getmeili/meilisearch:latest'
    container_name: ms_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: 'ROOT_MUPEZENI_MASTER_KEY_0102'  # Set a strong master key for security
#      MEILI_MASTER_KEY: '${MEILISEARCH_MASTER_KEY}'
    ports:
      - "7700:7700"
#      - '${FORWARD_MEILISEARCH_PORT:-7700}:7700'
    volumes:
      - meilisearch:/meili_data
    networks:
      - microservices-net
    healthcheck:
      test: set -o pipefail;curl -fsS http://localhost:7700/health | grep -q '{"status":"available"}'
      retries: 3
      timeout: 5s

  opensearch:
    build: .
    container_name: marketplace_os
    hostname: marketplace_os
    ports:
      - 9200:9200
      - 9600:9600
    environment:
      - discovery.type=single-node
      - "DISABLE_SECURITY_PLUGIN=true"
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: marketplace_os_dashboards
    ports:
      - 5601:5601
    environment:
      OPENSEARCH_HOSTS: '["http://marketplace-os:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      - opensearch

  mysql:
    image: mysql
    container_name: mysql_db
    restart: unless-stopped
    ports:
      - "3307:3306"  # Maps host port 3307 to container port 3306
    environment:
      MYSQL_ROOT_PASSWORD: Mupezeni0102?
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - microservices-net


  postgres:
    container_name: ms_pd_sql
    image: postgres
    user: postgres  # Add this line
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: Mupezeni0102?
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - microservices-net
    restart: unless-stopped

  pgadmin:
    container_name: ms_pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - 5050:80
    networks:
      - microservices-net
    restart: unless-stopped

  mongo:
    container_name: ms_mongo_db
    image: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 'Mupezeni0102'
    ports:
      - "27017:27017"
    volumes:
      - mongo:/data/db
    networks:
        - microservices-net

  opengauss:
    image: opengauss/opengauss:latest
    container_name: opengauss
    privileged: true
    environment:
      - GS_PASSWORD=openGauss@123
      - GS_USERNAME=root
      - GS_USER_PASSWORD=Mupezeni0102?
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - opengauss_data:/var/lib/opengauss/data

  cassandra:
    image: cassandra:latest
    container_name: cassandra-container
    restart: unless-stopped
    networks:
      - microservices-net
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_USER=root
      - CASSANDRA_PASSWORD=Mupezeni0102
    volumes:
      - cassandra-data:/var/lib/cassandra

  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_PASS: Mupezeni0102?
      RABBITMQ_DEFAULT_USER: root
    image: "rabbitmq:3-management-alpine"
    container_name: ms_rabbitmq
    ports:
      - "15672:15672"
      - "5672:5672"

  redis:
    image: "redis:latest"
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - microservices-net

  redis-insight:
    image: redis/redisinsight:latest
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - redis-insight:/data
    networks:
      - microservices-net

  minio:
    image: quay.io/minio/minio
    container_name: "minio"
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: Mupezeni0102?
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - microservices-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3


  sqlite:
    image: hibitdev/sqlite:latest
    container_name: ms_sqlite
    hostname: sqlite.hibit
    restart: unless-stopped
    ports:
      - "8191:8191"
    volumes:
      - sqlite:/db
    command: [ "tail", "-f", "/dev/null" ]



